name: "02 · Generate Statistics & Deploy Site"

# ─────────────────────────────────────────────────────────────────────────────
# Reads the gitdata branch → generates dashboard HTML → pushes to site branch.
# GitHub Pages serves the site branch (root folder).
#
# Triggered automatically after a successful harvest, or manually.
#
# Required secrets:
#   HARVEST_TOKEN  — classic PAT with 'repo' scope  (reads gitdata)
#   ACTIONS_TOKEN  — classic PAT with 'repo'+'workflow' (writes to site)
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_run:
    workflows: ["01 · Harvest Traffic Data"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  statistics:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main (engine code)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r packages/engine/requirements.txt

      - name: Configure git identity
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone gitdata branch (read)
        env:
          HARVEST_TOKEN: ${{ secrets.HARVEST_TOKEN }}
        run: |
          git clone \
            --branch gitdata \
            --depth 1 \
            "https://x-access-token:${HARVEST_TOKEN}@github.com/${{ github.repository }}.git" \
            /tmp/vault
          echo "✅  Vault cloned: $(ls /tmp/vault)"

      - name: Generate statistics + dashboard HTML
        run: |
          python -m packages.engine.statistics \
            --vault  /tmp/vault \
            --output /tmp/stats-output
          echo "✅  Generated:"
          ls -lh /tmp/stats-output/

      - name: Clone site branch (write)
        env:
          ACTIONS_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
        run: |
          git clone \
            --branch site \
            --depth 1 \
            "https://x-access-token:${ACTIONS_TOKEN}@github.com/${{ github.repository }}.git" \
            /tmp/site
          echo "✅  Site branch cloned"

      - name: Copy dashboard into site branch
        run: |
          # Dashboard HTML — served at root by GitHub Pages
          cp /tmp/stats-output/docs/index.html /tmp/site/index.html

          # JSON reports — referenced by the dashboard JS
          mkdir -p /tmp/site/reports
          cp /tmp/stats-output/reports/*.json /tmp/site/reports/

          echo "✅  Files staged:"
          ls -lh /tmp/site/

      - name: Commit and push to site branch
        env:
          ACTIONS_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
        run: |
          cd /tmp/site
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing changed — skipping commit"
            exit 0
          fi

          DATESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "site: update dashboard ${DATESTAMP} [skip ci]"

          git push \
            "https://x-access-token:${ACTIONS_TOKEN}@github.com/${{ github.repository }}.git" \
            "HEAD:site"

          echo "✅  Site branch updated"

      - name: Print dashboard URL
        run: |
          OWNER=$(echo "${{ github.repository }}" | cut -d'/' -f1)
          REPO=$(echo  "${{ github.repository }}" | cut -d'/' -f2)
          echo ""
          echo "📊 Dashboard: https://${OWNER}.github.io/${REPO}"
