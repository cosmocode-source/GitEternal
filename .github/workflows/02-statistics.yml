name: "02 · Generate Statistics & Deploy Pages"

# ─────────────────────────────────────────────────────────────────────────────
# Reads GitData, generates analytics reports and a GitHub Pages
# dashboard, then pushes everything to My-Git-Statistics.
#
# Triggered automatically after a successful harvest, or manually.
#
# Required secrets:
#   GIT_ETERNAL_DATA_TOKEN  — fine-grained PAT, contents:read on GitData
#   GIT_ETERNAL_DATA_REPO   — owner/GitData
#   GIT_STATISTICS_TOKEN    — fine-grained PAT, contents:write on My-Git-Statistics
#   GIT_STATISTICS_REPO     — owner/My-Git-Statistics
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_run:
    workflows: ["01 · Harvest Traffic Data"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  statistics:
    # Only run if the harvester succeeded (or if manually dispatched)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r packages/engine/requirements.txt

      - name: Configure git identity
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone GitData (read-only)
        env:
          DATA_TOKEN: ${{ secrets.GIT_ETERNAL_DATA_TOKEN }}
          DATA_REPO:  ${{ secrets.GIT_ETERNAL_DATA_REPO }}
        run: |
          git clone \
            --branch gitdata \
            --depth 1 \
            "https://x-access-token:${DATA_TOKEN}@github.com/${DATA_REPO}.git" \
            /tmp/vault
          echo "✅  Cloned vault: $(ls /tmp/vault)"

      - name: Generate statistics reports + HTML
        env:
          GIT_STATISTICS_REPO: ${{ secrets.GIT_STATISTICS_REPO }}
        run: |
          python -m packages.engine.statistics \
            --vault  /tmp/vault \
            --output /tmp/stats-output
          echo "✅  Generated output:"
          ls -lh /tmp/stats-output/

      - name: Clone My-Git-Statistics (write)
        env:
          STATS_TOKEN: ${{ secrets.GIT_STATISTICS_TOKEN }}
          STATS_REPO:  ${{ secrets.GIT_STATISTICS_REPO }}
        run: |
          git clone \
            --branch main \
            --depth 1 \
            "https://x-access-token:${STATS_TOKEN}@github.com/${STATS_REPO}.git" \
            /tmp/My-Git-Statistics

      - name: Copy reports and dashboard into My-Git-Statistics
        run: |
          # Reports (JSON) — consumed by dashboard JS
          mkdir -p /tmp/My-Git-Statistics/reports
          cp /tmp/stats-output/reports/*.json /tmp/My-Git-Statistics/reports/

          # Dashboard HTML
          mkdir -p /tmp/My-Git-Statistics/docs
          cp /tmp/stats-output/docs/index.html /tmp/My-Git-Statistics/docs/index.html

          echo "✅  Files copied"
          ls -lh /tmp/My-Git-Statistics/reports/
          ls -lh /tmp/My-Git-Statistics/docs/

      - name: Commit and push to My-Git-Statistics
        env:
          STATS_TOKEN: ${{ secrets.GIT_STATISTICS_TOKEN }}
          STATS_REPO:  ${{ secrets.GIT_STATISTICS_REPO }}
        run: |
          cd /tmp/My-Git-Statistics
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit — statistics unchanged"
            exit 0
          fi

          DATESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "stats: update analytics dashboard ${DATESTAMP} [skip ci]"

          REMOTE="https://x-access-token:${STATS_TOKEN}@github.com/${STATS_REPO}.git"
          git push "$REMOTE" HEAD:main
          echo "✅  Pushed statistics dashboard"

      - name: Print dashboard URL
        env:
          STATS_REPO: ${{ secrets.GIT_STATISTICS_REPO }}
        run: |
          OWNER=$(echo "$STATS_REPO" | cut -d'/' -f1)
          REPO=$(echo  "$STATS_REPO" | cut -d'/' -f2)
          echo ""
          echo "📊 Dashboard updated: https://${OWNER}.github.io/${REPO}"
