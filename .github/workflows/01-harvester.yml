name: "01 · Harvest Traffic Data"

# ─────────────────────────────────────────────────────────────────────────────
# Runs every Sunday at 06:00 UTC and collects GitHub traffic data for all
# repos accessible to HARVEST_TOKEN, storing results in git-eternal-data.
#
# Required secrets (add at Settings → Secrets and variables → Actions):
#   HARVEST_TOKEN           — classic PAT with 'repo' scope (YOUR account)
#   GIT_ETERNAL_DATA_TOKEN  — fine-grained PAT with contents:write on git-eternal-data
#   GIT_ETERNAL_DATA_REPO   — owner/git-eternal-data  (set automatically by 00-setup.yml)
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "0 6 * * 0"   # Every Sunday 06:00 UTC
  workflow_dispatch: {}    # Manual trigger

permissions:
  contents: read
  issues: write            # For failure issue creation

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r packages/engine/requirements.txt

      - name: Configure git identity
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verify HARVEST_TOKEN identity
        env:
          HARVEST_TOKEN: ${{ secrets.HARVEST_TOKEN }}
        run: |
          echo "=== Token identity ==="
          curl -s -H "Authorization: Bearer $HARVEST_TOKEN" \
               -H "User-Agent: GitEternal/1.0" \
               https://api.github.com/user | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print('  login :', d.get('login'))
          print('  type  :', d.get('type'))
          "
          echo "=== Token scopes ==="
          curl -s -I -H "Authorization: Bearer $HARVEST_TOKEN" \
               -H "User-Agent: GitEternal/1.0" \
               https://api.github.com/user \
          | grep -i "x-oauth-scopes" || echo "  (fine-grained PAT — no OAuth scopes header)"

      - name: Run harvester
        env:
          HARVEST_TOKEN:          ${{ secrets.HARVEST_TOKEN }}
          VAULT_TOKEN:            ${{ secrets.GIT_ETERNAL_DATA_TOKEN }}
          VAULT_REPO:             ${{ secrets.GIT_ETERNAL_DATA_REPO }}
        run: python -m packages.engine.harvester

      - name: Create failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const date   = new Date().toISOString().slice(0, 10);
            const title  = `[GitEternal] Harvest failed ${date}`;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100, labels: 'git-eternal,bug'
            });
            if (issues.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner, repo, title,
              body: [
                `Harvest failed on ${new Date().toISOString()}.`,
                `Run: ${runUrl}`,
                '',
                '**Common causes:**',
                '- `HARVEST_TOKEN` expired or lacks `repo` scope',
                '- `GIT_ETERNAL_DATA_TOKEN` lacks write access to the data vault',
                '- Rate limit exceeded',
              ].join('\n'),
              labels: ['git-eternal', 'bug'],
            });
