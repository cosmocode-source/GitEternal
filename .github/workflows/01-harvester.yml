name: "01 · Harvest Traffic Data"

# ─────────────────────────────────────────────────────────────────────────────
# Runs every Sunday at 06:00 UTC.
# Reads GitHub traffic API → writes JSON ledgers to the gitdata branch.
#
# Branch layout (all in this repo):
#   main    — this workflow lives here
#   gitdata — orphan branch where all data is stored
#
# Required secrets:
#   HARVEST_TOKEN   — classic PAT with 'repo' scope  (reads traffic API)
#   ACTIONS_TOKEN   — classic PAT with 'repo'+'workflow' (writes to gitdata)
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "0 6 * * 0"    # Every Sunday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues:   write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main (engine code)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r packages/engine/requirements.txt

      - name: Configure git identity
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verify HARVEST_TOKEN identity
        env:
          HARVEST_TOKEN: ${{ secrets.HARVEST_TOKEN }}
        run: |
          echo "=== Token identity ==="
          curl -s -H "Authorization: Bearer $HARVEST_TOKEN" \
               -H "User-Agent: GitEternal/1.0" \
               https://api.github.com/user | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print('  login :', d.get('login'))
          print('  type  :', d.get('type'))
          "
          echo "=== Token scopes ==="
          curl -s -I -H "Authorization: Bearer $HARVEST_TOKEN" \
               -H "User-Agent: GitEternal/1.0" \
               https://api.github.com/user \
          | grep -i "x-oauth-scopes" || echo "  (fine-grained PAT — no OAuth scopes header)"

      - name: Clone gitdata branch (vault)
        env:
          ACTIONS_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
        run: |
          git clone \
            --branch gitdata \
            --depth 1 \
            "https://x-access-token:${ACTIONS_TOKEN}@github.com/${{ github.repository }}.git" \
            /tmp/vault
          echo "✅  Vault cloned: $(ls /tmp/vault)"

      - name: Run harvester
        env:
          HARVEST_TOKEN: ${{ secrets.HARVEST_TOKEN }}
          VAULT_TOKEN:   ${{ secrets.ACTIONS_TOKEN }}
          VAULT_REPO:    ${{ github.repository }}
          VAULT_BRANCH:  gitdata
        run: python -m packages.engine.harvester

      - name: Create failure issue on error
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const date   = new Date().toISOString().slice(0, 10);
            const title  = `[GitEternal] Harvest failed ${date}`;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100
            });
            if (issues.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner, repo, title,
              body: [
                `Harvest failed on ${new Date().toISOString()}.`,
                `Run: ${runUrl}`,
                '',
                '**Common causes:**',
                '- `HARVEST_TOKEN` expired or missing `repo` scope',
                '- `ACTIONS_TOKEN` lacks write access to the `gitdata` branch',
                '- GitHub rate limit exceeded',
              ].join('\n'),
              labels: ['bug'],
            });
