name: "00 · Setup Branches"

# ─────────────────────────────────────────────────────────────────────────────
# ONE-TIME SETUP — creates the gitdata and site orphan branches in THIS repo.
#
# New architecture (single repo, three branches):
#
#   main      — engine code, workflows, Python harvester  [no data, no site]
#   gitdata   — orphan branch, raw traffic JSON vault     [private history]
#   site      — orphan branch, static dashboard HTML/CSS  [GitHub Pages source]
#
# Prerequisites
# ─────────────
# 1. Create a classic PAT (Settings → Developer settings → Personal access tokens)
#    with scopes:  repo  +  workflow
# 2. Add it as a secret named  SETUP_TOKEN  in this repo
#    (Settings → Secrets and variables → Actions → New repository secret)
# 3. Dispatch this workflow  (Actions → "00 · Setup Branches" → Run workflow)
#
# The workflow:
#   • Checks if gitdata / site branches already exist — skips if they do
#   • Creates gitdata as an orphan branch with seed JSON files
#   • Creates site as an orphan branch with a placeholder dashboard
#   • Enables GitHub Pages from the site branch (root folder)
#   • Adds required repo variables
#   • Prints instructions for the 2 secrets still needed manually
#   • Self-deletes (add  if: false  to the last step during testing)
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:

permissions:
  contents: write
  pages:    write
  actions:  write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GH_TOKEN: ${{ secrets.SETUP_TOKEN }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SETUP_TOKEN }}
          fetch-depth: 0        # need full history so we can push new branches

      - name: Resolve actor login
        id: actor
        run: |
          LOGIN=$(gh api /user --jq '.login')
          REPO="${{ github.repository }}"
          echo "login=$LOGIN"   >> $GITHUB_OUTPUT
          echo "repo=$REPO"     >> $GITHUB_OUTPUT
          echo "Authenticated as: $LOGIN  |  Repo: $REPO"

      # ── Configure git ───────────────────────────────────────────────────────
      - name: Configure git identity
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # ── gitdata branch ──────────────────────────────────────────────────────
      - name: Create gitdata orphan branch
        run: |
          REPO="${{ steps.actor.outputs.repo }}"

          # Check if branch already exists
          if git ls-remote --exit-code --heads origin gitdata > /dev/null 2>&1; then
            echo "⚠️  Branch 'gitdata' already exists — skipping"
            exit 0
          fi

          echo "Creating orphan branch: gitdata"
          WORK=$(mktemp -d)
          cd "$WORK"

          git init
          git checkout --orphan gitdata

          # ── Seed files ──────────────────────────────────────────────────────
          printf '{"version":2,"repos":{}}\n'        > index.json
          printf '{"runs":[]}\n'                     > harvest_log.json
          printf '{"tracked_repos":[]}\n'            > config.json
          mkdir -p data

          cat > README.md << 'EOF'
          # gitdata branch

          **Orphan branch — do not merge into main.**

          This branch is the raw traffic vault for GitEternal.
          All files here are written automatically by the `01 · Harvest` workflow.
          Do not edit manually.

          ## Structure
          ```
          index.json          — lifetime stats index per repo
          harvest_log.json    — last 50 harvest run records
          config.json         — harvester runtime config
          owner_stats.json    — GitHub profile + commit/PR/issue counts
          data/
            {owner}/
              {repo}/
                {year}/
                  {YYYY-MM}.json
          ```
          EOF

          git add -A
          git commit -m "chore: initialize gitdata vault [skip ci]"

          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git push "$REMOTE" "HEAD:gitdata"
          echo "✅  Branch gitdata created and pushed"

      # ── site branch ─────────────────────────────────────────────────────────
      - name: Create site orphan branch
        run: |
          OWNER="${{ steps.actor.outputs.login }}"
          REPO="${{ steps.actor.outputs.repo }}"
          REPO_NAME=$(echo "$REPO" | cut -d'/' -f2)

          if git ls-remote --exit-code --heads origin site > /dev/null 2>&1; then
            echo "⚠️  Branch 'site' already exists — skipping"
            exit 0
          fi

          echo "Creating orphan branch: site"
          WORK=$(mktemp -d)
          cd "$WORK"

          git init
          git checkout --orphan site

          # ── Placeholder dashboard ────────────────────────────────────────────
          cat > index.html << HTMLEOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width,initial-scale=1.0">
            <title>GitEternal — Initializing</title>
            <style>
              *{margin:0;padding:0;box-sizing:border-box}
              body{min-height:100vh;display:flex;align-items:center;justify-content:center;
                   background:#0d1117;color:#c9d1d9;
                   font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
              .box{text-align:center;padding:2rem;max-width:480px}
              h1{font-size:1.75rem;color:#f0f6fc;margin:.75rem 0 .5rem}
              p{color:#8b949e;line-height:1.6;margin-bottom:1.5rem}
              .spinner{width:20px;height:20px;border:2px solid #30363d;
                       border-top-color:#58a6ff;border-radius:50%;
                       animation:spin 1s linear infinite;display:inline-block;
                       vertical-align:middle;margin-right:8px}
              @keyframes spin{to{transform:rotate(360deg)}}
              .badge{display:inline-block;background:#21262d;border:1px solid #30363d;
                     border-radius:6px;padding:.5rem 1rem;color:#58a6ff;font-size:.875rem}
            </style>
          </head>
          <body>
            <div class="box">
              <div style="font-size:3rem">⏳</div>
              <h1>GitEternal Statistics</h1>
              <p>Dashboard initializing.<br>Run the <strong>01 · Harvest</strong> workflow to populate your data.</p>
              <div class="badge"><span class="spinner"></span>Waiting for first harvest…</div>
            </div>
          </body>
          </html>
          HTMLEOF

          cat > README.md << EOF
          # site branch

          **Orphan branch — do not merge into main.**

          This branch contains the static dashboard served via GitHub Pages.
          All files here are written automatically by the \`02 · Statistics\` workflow.

          📊 **[View Dashboard →](https://${OWNER}.github.io/${REPO_NAME})**
          EOF

          git add -A
          git commit -m "chore: initialize site branch [skip ci]"

          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git push "$REMOTE" "HEAD:site"
          echo "✅  Branch site created and pushed"

      # ── Enable GitHub Pages ─────────────────────────────────────────────────
      - name: Enable GitHub Pages from site branch
        run: |
          OWNER="${{ steps.actor.outputs.login }}"
          REPO_NAME=$(echo "${{ steps.actor.outputs.repo }}" | cut -d'/' -f2)

          sleep 4   # give GitHub a moment after the push

          # Try to enable Pages (may already be enabled — that's fine)
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$OWNER/$REPO_NAME/pages" \
            -f "source[branch]=site" \
            -f "source[path]=/" \
            2>&1 | tee /tmp/pages_response.txt || true

          if grep -q "already enabled\|409\|422" /tmp/pages_response.txt 2>/dev/null; then
            # Already enabled — just update the source branch
            gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/repos/$OWNER/$REPO_NAME/pages" \
              -f "source[branch]=site" \
              -f "source[path]=/" \
              2>&1 || true
          fi

          echo "✅  GitHub Pages configured → https://${OWNER}.github.io/${REPO_NAME}"

      # ── Store repo variables ────────────────────────────────────────────────
      - name: Set repository variables
        run: |
          REPO="${{ steps.actor.outputs.repo }}"
          OWNER="${{ steps.actor.outputs.login }}"
          REPO_NAME=$(echo "$REPO" | cut -d'/' -f2)

          # Store as Actions variables (visible in logs, not sensitive)
          gh variable set GIT_ETERNAL_OWNER     --body "$OWNER"     --repo "$REPO"
          gh variable set GIT_ETERNAL_REPO_NAME --body "$REPO_NAME" --repo "$REPO"

          echo "✅  Variables set: GIT_ETERNAL_OWNER=$OWNER  GIT_ETERNAL_REPO_NAME=$REPO_NAME"

      # ── Instructions ────────────────────────────────────────────────────────
      - name: Print next steps
        run: |
          OWNER="${{ steps.actor.outputs.login }}"
          REPO="${{ steps.actor.outputs.repo }}"
          REPO_NAME=$(echo "$REPO" | cut -d'/' -f2)

          echo ""
          echo "╔══════════════════════════════════════════════════════════════════╗"
          echo "║              ✅  SETUP COMPLETE — ACTION REQUIRED               ║"
          echo "╠══════════════════════════════════════════════════════════════════╣"
          echo "║                                                                  ║"
          echo "║  Branches created:                                               ║"
          echo "║    main     — engine code + workflows (this branch)             ║"
          echo "║    gitdata  — orphan, raw traffic vault                         ║"
          echo "║    site     — orphan, GitHub Pages dashboard                    ║"
          echo "║                                                                  ║"
          echo "║  Add 2 secrets at:                                               ║"
          echo "║  https://github.com/$REPO/settings/secrets/actions"
          echo "║                                                                  ║"
          echo "║  ┌──────────────────┬────────────────────────────────────────┐  ║"
          echo "║  │ Secret name      │ Value                                  │  ║"
          echo "║  ├──────────────────┼────────────────────────────────────────┤  ║"
          echo "║  │ HARVEST_TOKEN    │ Classic PAT with 'repo' scope          │  ║"
          echo "║  │                  │ (reads YOUR traffic + profile data)    │  ║"
          echo "║  ├──────────────────┼────────────────────────────────────────┤  ║"
          echo "║  │ ACTIONS_TOKEN    │ Classic PAT with 'repo' + 'workflow'   │  ║"
          echo "║  │                  │ (writes to gitdata + site branches)    │  ║"
          echo "║  └──────────────────┴────────────────────────────────────────┘  ║"
          echo "║                                                                  ║"
          echo "║  Then run:  Actions → '01 · Harvest Traffic Data'               ║"
          echo "║                                                                  ║"
          echo "║  Dashboard will be live at:                                      ║"
          echo "║  https://${OWNER}.github.io/${REPO_NAME}"
          echo "║                                                                  ║"
          echo "╚══════════════════════════════════════════════════════════════════╝"

      # ── Self-delete (comment out `if: false` during testing) ────────────────
      - name: Delete this setup workflow
        # if: false   # ← uncomment this line while testing to prevent self-deletion
        run: |
          REPO="${{ steps.actor.outputs.repo }}"
          SHA=$(gh api "/repos/$REPO/contents/.github/workflows/00-setup.yml" \
                --jq '.sha' 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api \
              --method DELETE \
              "/repos/$REPO/contents/.github/workflows/00-setup.yml" \
              -f "message=chore: remove setup workflow after init [skip ci]" \
              -f "sha=$SHA" \
              -f "branch=main" \
              && echo "✅  Setup workflow self-deleted" \
              || echo "⚠️  Could not delete — remove .github/workflows/00-setup.yml manually"
          fi
