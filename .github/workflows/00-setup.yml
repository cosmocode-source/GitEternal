name: "00 · Initial Setup"

# ─────────────────────────────────────────────────────────────────────────────
# ONE-TIME SETUP — run this once to bootstrap GitData and My-Git-Statistics.
#
# Prerequisites
# ──────────────
# 1. Create a classic PAT (Settings → Developer settings → Personal access tokens)
#    with scopes:  repo  +  workflow  +  delete:packages (optional)
#    OR a fine-grained PAT with:
#      • Repository permissions: Contents (read/write), Pages (write), Workflows (write)
#      • Account permissions: N/A
# 2. Add it as a secret named  SETUP_TOKEN  in THIS repo
#    (Settings → Secrets and variables → Actions → New repository secret)
# 3. Dispatch this workflow (Actions tab → "00 · Initial Setup" → Run workflow)
#
# What it does
# ─────────────
# • Creates  GitData  (private)  — the data vault
# • Creates  My-Git-Statistics    (public)   — the GitHub Pages dashboard
# • Initializes both with a first orphan commit
# • Enables GitHub Pages on My-Git-Statistics  (docs/ folder)
# • Adds all required secrets to this repo
# • Deletes itself so it never runs again
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      data_repo_name:
        description: "Name for the data vault repo"
        required: false
        default: "GitData"
      stats_repo_name:
        description: "Name for the statistics repo"
        required: false
        default: "My-Git-Statistics"

permissions:
  contents: write
  actions: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GH_TOKEN: ${{ secrets.SETUP_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve actor login
        id: actor
        run: |
          LOGIN=$(gh api /user --jq '.login')
          echo "login=$LOGIN" >> $GITHUB_OUTPUT
          echo "Authenticated as: $LOGIN"

      # ── Create GitData ──────────────────────────────────────────
      - name: Create GitData repo
        id: create_data
        run: |
          OWNER="${{ steps.actor.outputs.login }}"
          REPO="${{ github.event.inputs.data_repo_name }}"
          FULL="$OWNER/$REPO"

          # Check if it already exists
          if gh repo view "$FULL" > /dev/null 2>&1; then
            echo "⚠️  $FULL already exists — skipping creation"
          else
            gh repo create "$FULL" \
              --private \
              --description "GitEternal_v2 data vault — auto-managed, do not edit manually" \
              --no-clone
            echo "✅  Created $FULL (private)"
          fi
          echo "full_name=$FULL" >> $GITHUB_OUTPUT

      - name: Initialize GitData with orphan commit
        run: |
          FULL="${{ steps.create_data.outputs.full_name }}"
          OWNER="${{ steps.actor.outputs.login }}"
          REPO="${{ github.event.inputs.data_repo_name }}"

          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          TMPDIR=$(mktemp -d)
          cd "$TMPDIR"
          git init
          git checkout --orphan gitdata

          # Seed files (use printf to avoid heredoc indentation issues)
          printf '{"version": 2, "repos": {}}\n' > index.json
          printf '{"runs": []}\n'               > harvest_log.json
          printf '{"tracked_repos": []}\n'      > config.json

          cat > README.md <<EOF
          # GitData

          This repository is the **data vault** for [GitEternal_v2](https://github.com/$OWNER/GitEternal_v2).

          It is automatically managed by the harvester workflow. **Do not edit files manually.**

          ## Structure

          \`\`\`
          index.json          — lifetime stats summary per repo
          harvest_log.json    — last 50 harvest run records
          config.json         — list of tracked repos
          data/               — raw monthly traffic ledgers
            {owner}/
              {repo}/
                {year}/
                  {YYYY-MM}.json
          \`\`\`

          ## Privacy

          This repo is **private**. Only you can see the raw traffic data.
          The [My-Git-Statistics](https://github.com/$OWNER/${{ github.event.inputs.stats_repo_name }})
          repo publishes aggregated, non-sensitive summaries.
          EOF

          git add -A
          git commit -m "chore: initialize data vault [skip ci]"

          REMOTE_URL="https://x-access-token:${GH_TOKEN}@github.com/${FULL}.git"
          git push "$REMOTE_URL" "HEAD:gitdata" --force
          echo "✅  Initialized $FULL on branch gitdata"

      # ── Create My-Git-Statistics ─────────────────────────────────────────────
      - name: Create My-Git-Statistics repo
        id: create_stats
        run: |
          OWNER="${{ steps.actor.outputs.login }}"
          REPO="${{ github.event.inputs.stats_repo_name }}"
          FULL="$OWNER/$REPO"

          if gh repo view "$FULL" > /dev/null 2>&1; then
            echo "⚠️  $FULL already exists — skipping creation"
          else
            gh repo create "$FULL" \
              --public \
              --description "GitEternal_v2 statistics dashboard — auto-generated, view at https://$OWNER.github.io/$REPO" \
              --no-clone
            echo "✅  Created $FULL (public)"
          fi
          echo "full_name=$FULL" >> $GITHUB_OUTPUT

      - name: Initialize My-Git-Statistics with placeholder dashboard
        run: |
          FULL="${{ steps.create_stats.outputs.full_name }}"
          OWNER="${{ steps.actor.outputs.login }}"
          REPO="${{ github.event.inputs.stats_repo_name }}"

          TMPDIR=$(mktemp -d)
          cd "$TMPDIR"
          git init
          git checkout --orphan main

          mkdir -p docs reports

          # Placeholder reports
          echo '{"generated_at":"","total_repos":0,"lifetime_clones":0,"lifetime_uniques":0,"most_active_repo":null}' > reports/summary.json
          echo '[]' > reports/top_repos.json
          echo '[]' > reports/trends.json

          cat > README.md <<EOF
          # My-Git-Statistics

          Auto-generated analytics dashboard for **$OWNER**'s GitHub repositories.

          📊 **[View Dashboard →](https://$OWNER.github.io/$REPO)**

          Updated weekly by [GitEternal_v2](https://github.com/$OWNER/GitEternal_v2).
          EOF

          # Placeholder dashboard HTML (will be overwritten by 02-statistics.yml)
          cat > docs/index.html <<'HTMLEOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>GitEternal_v2 Statistics</title>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body {
                min-height: 100vh; display: flex; align-items: center; justify-content: center;
                background: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
              }
              .container { text-align: center; padding: 2rem; }
              .logo { font-size: 3rem; margin-bottom: 1rem; }
              h1 { font-size: 1.8rem; font-weight: 600; margin-bottom: 0.5rem; color: #f0f6fc; }
              p { color: #8b949e; margin-bottom: 1.5rem; }
              .badge {
                display: inline-block; background: #21262d; border: 1px solid #30363d;
                border-radius: 6px; padding: 0.5rem 1rem; color: #58a6ff; font-size: 0.875rem;
              }
              .spinner {
                width: 20px; height: 20px; border: 2px solid #30363d; border-top-color: #58a6ff;
                border-radius: 50%; animation: spin 1s linear infinite; display: inline-block;
                vertical-align: middle; margin-right: 8px;
              }
              @keyframes spin { to { transform: rotate(360deg); } }
            </style>
          </head>
          <body>
            <div class="container">
              <div class="logo">⏳</div>
              <h1>GitEternal_v2 Statistics</h1>
              <p>Dashboard initializing — first harvest hasn't run yet.</p>
              <div class="badge">
                <span class="spinner"></span>
                Waiting for first harvest run...
              </div>
            </div>
          </body>
          </html>
          HTMLEOF

          git add -A
          git commit -m "chore: initialize statistics repo [skip ci]"

          REMOTE_URL="https://x-access-token:${GH_TOKEN}@github.com/${FULL}.git"
          git push "$REMOTE_URL" "HEAD:main" --force
          echo "✅  Initialized $FULL on branch main"

      # ── Enable GitHub Pages ───────────────────────────────────────────────
      - name: Enable GitHub Pages on My-Git-Statistics
        run: |
          OWNER="${{ steps.actor.outputs.login }}"
          REPO="${{ github.event.inputs.stats_repo_name }}"

          # Wait a moment for the repo to be ready
          sleep 3

          # Enable Pages via API (source: docs/ folder on main branch)
          RESPONSE=$(gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$OWNER/$REPO/pages" \
            -f "source[branch]=main" \
            -f "source[path]=/docs" \
            2>&1 || true)

          echo "Pages API response: $RESPONSE"
          echo "✅  GitHub Pages enabled at https://$OWNER.github.io/$REPO"

      # ── Store secrets in main repo ────────────────────────────────────────
      - name: Add secrets to main repo
        run: |
          OWNER="${{ steps.actor.outputs.login }}"
          DATA_FULL="${{ steps.create_data.outputs.full_name }}"
          STATS_FULL="${{ steps.create_stats.outputs.full_name }}"
          MAIN_REPO="${{ github.repository }}"

          # Store repo names as secrets (not sensitive, but convenient)
          gh secret set GIT_ETERNAL_DATA_REPO \
            --body "$DATA_FULL" \
            --repo "$MAIN_REPO"

          gh secret set GIT_STATISTICS_REPO \
            --body "$STATS_FULL" \
            --repo "$MAIN_REPO"

          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║              SETUP COMPLETE — ACTION REQUIRED                ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║                                                              ║"
          echo "║  You still need to add 3 secrets manually:                  ║"
          echo "║                                                              ║"
          echo "║  1. HARVEST_TOKEN                                            ║"
          echo "║     Classic PAT with 'repo' scope                           ║"
          echo "║     (reads YOUR traffic data from GitHub API)               ║"
          echo "║                                                              ║"
          echo "║  2. GIT_ETERNAL_DATA_TOKEN                                   ║"
          echo "║     Fine-grained PAT — write access to:                     ║"
          echo "║       $DATA_FULL"
          echo "║     Permission: Repository contents (read/write)            ║"
          echo "║                                                              ║"
          echo "║  3. GIT_STATISTICS_TOKEN                                     ║"
          echo "║     Fine-grained PAT — write access to:                     ║"
          echo "║       $STATS_FULL"
          echo "║     Permission: Repository contents (read/write)            ║"
          echo "║                                                              ║"
          echo "║  Add them at:                                                ║"
          echo "║  https://github.com/$MAIN_REPO/settings/secrets/actions     ║"
          echo "║                                                              ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

      # ── Self-destruct ─────────────────────────────────────────────────────
      - name: Delete this setup workflow
        run: |
          MAIN_REPO="${{ github.repository }}"
          # Delete the workflow file via API so it doesn't clutter the Actions tab
          SHA=$(gh api "/repos/$MAIN_REPO/contents/.github/workflows/00-setup.yml" --jq '.sha' 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api \
              --method DELETE \
              "/repos/$MAIN_REPO/contents/.github/workflows/00-setup.yml" \
              -f "message=chore: remove setup workflow after successful init [skip ci]" \
              -f "sha=$SHA" \
              -f "branch=main" || echo "⚠️  Could not delete workflow file — remove it manually"
            echo "✅  Setup workflow deleted"
          fi
